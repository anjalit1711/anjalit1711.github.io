<!DOCTYPE html>
<html>
<head>
    <title>Face Beauty Advanced</title>

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:linear-gradient(pink,white);
        }

        /* Sticky Header */
        header{
            background:#ff4d88;
            padding:15px;
            position:sticky;
            top:0;
            z-index:1000;
            display:flex;
            justify-content:space-between;
            color:white;
        }

        nav ul{
            list-style:none;
        }

        nav ul li{
            display:inline-block;
            margin:0 10px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
        }

        nav ul li a:hover{
            color:yellow;
        }

        /* Hero */
        .hero{
            height:60vh; /* viewport height use */
            text-align:center;
            padding-top:100px;
            background:rgba(255,182,193,0.6);
            border-bottom:5px dashed #ff4d88;
        }

        /* Scroll Section */
        .section{
            padding:40px;
            margin:20px;
            border:3px solid #ff4d88;
            border-radius:10px;
            background:white;
            outline:4px solid pink;
            outline-offset:5px;
        }

        /* Relative + Absolute */
        .box{
            width:300px;
            height:200px;
            background:#ffe6f0;
            margin:30px auto;
            position:relative;
            overflow:hidden;
            border:4px solid purple;
        }

        .badge{
            position:absolute;
            top:10px;
            right:10px;
            background:red;
            color:white;
            padding:5px 10px;
        }

        /* Opacity */
        .fade{
            opacity:0.7;
        }

        /* Fixed Button */
        .fixed-btn{
            position:fixed;
            bottom:20px;
            right:20px;
            background:#ff4d88;
            color:white;
            padding:10px 15px;
            border:none;
            cursor:pointer;
        }

        .fixed-btn:hover{
            opacity:0.8;
        }

        footer{
            background:#ff4d88;
            color:white;
            text-align:center;
            padding:20px;
            margin-top:50px;
        }

        /* Media Query for Viewport */
        @media(max-width:600px){
            header{
                flex-direction:column;
                text-align:center;
            }
        }

    </style>
</head>

<body>

<header>
    <h2>Face Beauty</h2>
    <nav>
        <ul>
            <li><a href="#">All</a></li>
            <li><a href="#">Paneer</a></li>
            <li><a href="#">North India</a></li>
            <li><a href="#">Pizza</li>
            <li><a href="#">Desserts</li>
        </ul>
    </nav>
</header>

<div class="hero">
    <h1>Veg & Non-veg✨</h1>
    
</div>








<div class="section">
    <h2>Even More Scroll Content</h2>
    <p>Keep scrolling to test sticky header properly.</p>
    <p>Face beauty is about confidence and self care.</p>
    <p>Healthy lifestyle gives natural glow.</p>
</div>

<button class="fixed-btn">Contact</button>

<footer>
    © 2026 Face Beauty | All Rights Reserved
</footer>

</body>
</html>
