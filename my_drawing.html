<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anjali Art Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(to bottom,#fff7ed,#fde68a,#fca5a5);
    overflow-x:hidden;
}

/* Background Glow */

.circle1,.circle2{
    position:fixed;
    border-radius:50%;
    filter:blur(100px);
    z-index:-1;
}

.circle1{
    width:300px;
    height:300px;
    background:#fb7185;
    top:-50px;
    left:-50px;
}

.circle2{
    width:350px;
    height:350px;
    background:#facc15;
    bottom:-50px;
    right:-50px;
}

/* Header */

header{
    text-align:center;
    padding:60px 20px 30px;
}

header h1{
    font-size:55px;
    color:#7c2d12;
    text-shadow:2px 2px 10px rgba(0,0,0,0.2);
}

header p{
    margin-top:15px;
    font-size:20px;
    color:#5b341d;
}

/* Gallery */

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:35px;
    padding:50px;
}

/* Cards */

.card{
    background:rgba(255,255,255,0.4);
    backdrop-filter:blur(10px);
    border-radius:30px;
    overflow:hidden;
    border:3px solid rgba(255,255,255,0.5);
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    transition:0.4s;
    position:relative;
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
}

/* Images */

.card img{
    width:100%;
    height:320px;
    object-fit:contain;
    background:white;
    padding:15px;
}

/* Titles */

.card h2{
    text-align:center;
    padding:20px;
    color:#7c2d12;
    font-size:24px;
}

/* Paint Emoji */

.card::before{
    content:"🎨";
    position:absolute;
    top:10px;
    right:15px;
    font-size:28px;
}

/* Footer */

footer{
    text-align:center;
    padding:25px;
    background:#7c2d12;
    color:white;
    font-size:18px;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>

<header>
    <h1>🎨 Anjali Art Gallery</h1>
    <p>Beautiful scenery drawings made in MS Paint ✨</p>
</header>

<div class="gallery">

    <div class="card">
        <img src="paint.png" alt="Night Moon">
        <h2>Mountain View</h2>
    </div>

    <div class="card">
        <img src="p1.png" alt="A mesmerizing moon glowing through the dark crimson night ✨">
        <h2>Sunset Art</h2>
    </div>

    <div class="card">
        <img src="p3.jpg" alt="River Side">
        <h2>Nature Beauty</h2>
    </div>

    <div class="card">
        <img src="p2.jpg" alt="Sticky Snake">
        <h2>River Side</h2>
    </div>

</div>

<footer>
✨ Made with ❤️ by Anjali ✨
</footer>

</body>
</html>
