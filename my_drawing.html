
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Paint Art Gallery</title>

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(to right,#dbeafe,#f0f9ff);
    text-align:center;
}

header{
    background:#2563eb;
    color:white;
    padding:25px;
    font-size:35px;
    font-weight:bold;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

p{
    color:#333;
    font-size:18px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:40px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card h2{
    margin:15px 0;
    color:#2563eb;
}

footer{
    background:#111827;
    color:white;
    padding:15px;
    margin-top:20px;
}
</style>
</head>

<body>

<header>
🎨 My Paint Art Gallery
</header>

<p>Beautiful scenery drawings made in MS Paint ✨</p>

<div class="gallery">

<div class="card">
<img src="scenery1.png" alt="Scenery 1">
<h2>Mountain View</h2>
</div>

<div class="card">
<img src="scenery2.png" alt="Scenery 2">
<h2>Sunset Art</h2>
</div>

<div class="card">
<img src="scenery3.png" alt="Scenery 3">
<h2>Nature Beauty</h2>
</div>

<div class="card">
<img src="scenery4.png" alt="Scenery 4">
<h2>River Side</h2>
</div>

</div>

<footer>
Made with ❤️ by Anjali
</footer>

</body>
</html>
