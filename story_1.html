<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Universe PRO AI</title>
<style>

body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  overflow:hidden;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.35);
  z-index:-1;
  transition:1s;
}

header{
  text-align:center;
  padding:12px;
  background:#111;
  font-size:28px;
  font-weight:bold;
  box-shadow:0 0 20px red;
}

/* ⭐ NEW MAIN LAYOUT (story + QR side by side) */
.main{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:20px;
  margin:15px auto;
  padding:0 10px;
}

/* STORY BOX */
.story-box{
  max-width:750px;
  width:100%;
  background:rgba(0,0,0,0.75);
  padding:15px;
  border-radius:10px;
  height:60vh;
  overflow-y:auto;
  white-space:pre-line;
  font-size:16px;
  box-shadow:0 0 15px rgba(255,0,0,0.5);
}

.story-box::-webkit-scrollbar{
  width:8px;
}

.story-box::-webkit-scrollbar-thumb{
  background:red;
  border-radius:10px;
}

/* BUTTONS */
.controls{
  text-align:center;
}

button{
  margin:4px;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#2196f3;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

/* ⭐ PAY WALL (NOW SIDE CARD) */
#payWall{
display:none;
text-align:center;
background:#111;
padding:20px;
border-radius:10px;
max-width:300px;
box-shadow:0 0 20px red;
animation:glow 1.5s infinite alternate;
}

#payWall h2{
color:red;
font-size:22px;
}

#payWall img{
border-radius:15px;
border:4px solid white;
margin-top:10px;
width:100%;
max-width:260px;
}

#payWall button{
padding:12px 20px;
background:red;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

@keyframes glow{
from{
box-shadow:0 0 10px red;
}
to{
box-shadow:0 0 25px crimson;
}
}

/* ⭐ MOBILE RESPONSIVE */
@media(max-width:768px){
  .main{
    flex-direction:column;
    align-items:center;
  }

  #payWall{
    max-width:90%;
  }
}

</style>

</head>

<body>
<div class="main">

  <div class="story-box" id="storyBox">
    Select a horror story 👻
  </div>

  <div id="payWall">
    <h2>🔒 Pay ₹10 To Continue</h2>

    <img src="qr.jpg" width="260">

    <p>Scan QR & Pay ₹10 to unlock full horror story 👻</p>

    <button onclick="unlockStory()">I Have Paid</button>
  </div>

</div>

<div class="bg" id="bg"></div>

<header>
👻 Story Universe PRO AI
</header>

<div class="controls">
<button onclick="startStory(1)">Story 1</button>
<button onclick="startStory(2)">Story 2</button>
<button onclick="startStory(3)">Story 3</button>
<button onclick="startStory(4)">Story 4</button>
<button onclick="startStory(5)">Story 5</button>
</div>


<div class="controls">

<button onclick="speakHindi()">🔊 Hindi</button>

<button onclick="speakEnglish()">🔊 English</button>

<button onclick="pauseVoice()">⏸ Pause</button>

<button onclick="resumeVoice()">▶ Resume</button>

<button onclick="stopAll()">⏹ Stop</button>

<button onclick="translateText()">🌐 Translate</button>

<button onclick="zoomIn()">🔍 +</button>

<button onclick="zoomOut()">🔍 -</button>

</div>

<script>

let zoom = 16;
let isHindi = true;

/* STORY 1 */

let story1Part1 = `Raat ka waqt tha. Baarish ki halki boonden purani haveli ki tooti chhat par gir rahi thi. Aarav apni maa ki purani diary lekar us ghar mein aaya tha, jahan bachpan mein usne sab kuch kho diya tha. Diary ke aakhri panne par sirf itna likha tha — “Sach hamesha isi ghar mein chhupa hai.” Dil zor se dhadak raha tha, lekin usse lag raha tha ki aaj usse apne sawaalon ka jawab mil jayega.

Haveli ke andar sab kuch sannaata tha. Jaise waqt yahin ruk gaya ho. Aarav dheere-dheere seedhiyan chadhne laga, tabhi usse kisi ke chalne ki awaaz sunayi di. Woh ruk gaya. “Koi hai?” usne dheere se poocha… lekin jawab mein sirf hawa ki cheekh thi.`;

let story1Part2 = `Tabhi diary ka ek purana panna apne aap palat gaya. Us par likha tha — “Woh ab bhi yahin hai…” Aarav ke haath kaanpne lage.

Achanak ek kamre ka darwaza khud hi khul gaya. Andar andhera tha, lekin ek kone mein jalti hui diya si roshni thi. Aarav ne himmat karke andar kadam rakha… aur uski saansen ruk gayi. Diya ke paas uski maa khadi thi… wahi chehra, wahi muskaan… lekin aankhon mein ajeeb sa dard. “Maa…?” Aarav ki awaaz toot gayi.

Woh uski taraf badha, lekin jaise hi paas pahucha, uski maa ne haath utha kar use roka — “Sach jaanne ke liye tayyar ho?”

Maa ki aankhon se aansu behne lage. “Main kabhi gayi hi nahi thi, Aarav… main bas is ghar mein qaid ho gayi thi… aur jisne mujhe yahan baandh rakha hai… woh tum khud ho.”

Aarav ka dil jaise ruk gaya. Use yaad aaya… bachpan ki woh raat… gusse mein usne diya gira diya tha… aur aag ne sab kuch le liya.

Aakhri baar usne maa ki taraf dekha… aur phir sab kuch andhere mein kho gaya… sirf ek awaaz gunji — “Sach se kabhi bhaagna mat…”`;

/* STORY 2 */

let story2 = `Andheri raat thi, aur Ramnagar ke kinaare khadi purani haveli par bijli chamak rahi thi. Log kehte the ki yeh haveli 20 saalon se khaali hai, lekin har amavas ki raat wahan se kisi ke chalne ki awaaz aati hai. Kabir, jo ek curious journalist tha, in afwaahon ko jhooth sabit karna chahta tha. Apni camera aur recorder lekar woh us haveli ke darwaze tak pahunch gaya. Darwaza dheere se khola… aur ek thandi hawa ka jhonka uske chehre se takraaya.

Haveli ke andar sab kuch dhool se dhakka hua tha. Deewaron par purani tasveeren latak rahi thi, jinme logon ke chehre dheere-dheere mit chuke the. Kabir ne torch jalaya aur aage badha. Tabhi ek tasveer par nazar padi… usmein ek aadmi tha jo bilkul uski tarah dikh raha tha.

“Tum wapas aa gaye…” kisi ne uske kaan ke paas kaha.

Kabir ne peeche dekha, koi nahi tha. Recorder on kiya… lekin woh bhi band ho gaya. Thandi hawa badh gayi. Saans dikhne lagi.

Thak… thak… thak… seedhiyon se awaaz aayi.

Kabir upar gaya. Ek kamra khula tha. Andar aaina tha… aur uska reflection apne aap move kar raha tha.

Reflection bola — “Main tum hoon… aur tum main ho.”

Aur dheere-dheere reflection bahar aa gaya… real Kabir ban gaya.

Aakhri pal mein dono ek ho gaye… aur haveli phir se khamosh ho gayi.`;

/* STORY 3 */

let story3 = `Vivaan bachpan se game developer banna chahta tha. Log haste the, lekin usne coding seekhna nahi chhoda. Pehla game fail hua, dusra bhi perfect nahi tha, lekin woh roz improve karta gaya.

Usne purane laptop par coding ki, bugs fix kiye aur har problem se seekha. Ek din uska game viral ho gaya aur hazaaron log uska game khelne lage.

Vivaan ne samjha ki success talent se nahi, consistency se milti hai. Agar insaan haar na maane, toh woh kuch bhi achieve kar sakta hai.`;

/* STORY 4 */

let story4 = `Riya ko drawing aur animation ka bahut shauk tha. Financial problems aur logon ke taane usse rok nahi paaye. Usne free software se animation banana shuru kiya.

Kai baar laptop crash hua, kaam delete hua, lekin usne mehnat nahi chhodi. Dheere-dheere uske animations famous hone lage.

Aaj Riya ka khud ka animation studio hai aur woh doosron ko inspire karti hai ki sapne kabhi mat chhodo.`;

/* STORY 5 */

let story5 = `Arjun bahut shy ladka tha aur stage par bolne se darta tha. Ek din usne speech competition mein participate kiya.

Shuru mein uski awaaz kaanp rahi thi, lekin dheere-dheere usne confidence gain kiya. Logon ne uski speech ko bahut pasand kiya.

Baad mein wahi Arjun ek motivational speaker bana aur hazaaron logon ko inspire karne laga. Usne samjha ki fear ko harana hi asli success hai.`;

/* START STORY */

function startStory(n){

document.getElementById("payWall").style.display="none";

/* STORY 1 */

if(n==1){

storyBox.innerText = story1Part1;

setTimeout(()=>{
document.getElementById("payWall").style.display="block";
},3000);

window.currentStory = 1;

}

/* STORY 2 */

if(n==2){

let half = story2.substring(0, story2.length/2);

storyBox.innerText = half;

setTimeout(()=>{
document.getElementById("payWall").style.display="block";
},3000);

window.currentStory = 2;

}

/* STORY 3 */

if(n==3){

let half = story3.substring(0, story3.length/2);

storyBox.innerText = half;

setTimeout(()=>{
document.getElementById("payWall").style.display="block";
},3000);

window.currentStory = 3;

}

/* STORY 4 */

if(n==4){

let half = story4.substring(0, story4.length/2);

storyBox.innerText = half;

setTimeout(()=>{
document.getElementById("payWall").style.display="block";
},3000);

window.currentStory = 4;

}

/* STORY 5 */

if(n==5){

let half = story5.substring(0, story5.length/2);

storyBox.innerText = half;

setTimeout(()=>{
document.getElementById("payWall").style.display="block";
},3000);

window.currentStory = 5;

}

}

/* UNLOCK */

function unlockStory(){

document.getElementById("payWall").style.display="none";

if(window.currentStory==1){

storyBox.innerText =
story1Part1 + "\n\n" + story1Part2;

}

if(window.currentStory==2){

storyBox.innerText = story2;

}

if(window.currentStory==3){

storyBox.innerText = story3;

}

if(window.currentStory==4){

storyBox.innerText = story4;

}

if(window.currentStory==5){

storyBox.innerText = story5;

}

}

/* VOICE */

function speakHindi(){
speechSynthesis.cancel();
let s = new SpeechSynthesisUtterance(storyBox.innerText);
s.lang="hi-IN";
speechSynthesis.speak(s);
}

function speakEnglish(){
speechSynthesis.cancel();
let s = new SpeechSynthesisUtterance(storyBox.innerText);
s.lang="en-US";
speechSynthesis.speak(s);
}

function pauseVoice(){
speechSynthesis.pause();
}

function resumeVoice(){
speechSynthesis.resume();
}

function stopAll(){
speechSynthesis.cancel();
}

/* TRANSLATE */

function translateText(){

let text = storyBox.innerText;

fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${isHindi?'hi|en':'en|hi'}`)
.then(r=>r.json())
.then(d=>{
storyBox.innerText = d.responseData.translatedText;
isHindi=!isHindi;
});

}

/* ZOOM */

function zoomIn(){
zoom += 2;
storyBox.style.fontSize = zoom+"px";
}

function zoomOut(){
zoom -= 2;
storyBox.style.fontSize = zoom+"px";
}

</script>

</body>
</html>
