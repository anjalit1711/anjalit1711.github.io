<body>

<header>📖 Story Universe PRO AI</header>

<div class="container" id="storyList"></div>

<textarea id="content" placeholder="Story continue here using | separator">Raat ka waqt tha.| Baarish ki halki boonden purani haveli ki tooti chhat par gir rahi thi.|Aarav apni maa ki purani diary lekar us ghar mein aaya tha, jahan bachpan mein usne sab kuch kho diya tha.| Diary ke aakhri panne par sirf itna likha tha — “Sach hamesha isi ghar mein chhupa hai.|” Dil zor se dhadak raha tha, lekin usse lag raha tha ki aaj usse apne sawaalon ka jawab mil jayega.|

Maa ki aankhon se aansu behne lage.| “Main kabhi gayi hi nahi thi,| Aarav… main bas is ghar mein qaid ho gayi thi…| aur jisne mujhe yahan baandh rakha hai… woh tum khud ho.” Aarav ka dil jaise ruk gaya.| Use yaad aaya… bachpan ki woh raat… gusse mein usne diya gira diya tha… aur aag ne sab kuch le liya.| Aaj usse samajh aaya — woh sach se bhaag raha tha.| Aakhri baar usne maa ki taraf dekha…| aur phir sab kuch andhere mein kho gaya… |sirf ek awaaz gunji — “Sach se kabhi bhaagna mat…”|</textarea>
<button onclick="addStory()">➕ Add Story</button>
</div>
  
  <div class="addBox">
<input id="title" placeholder="A Dark Night Story...">
<input id="img" placeholder="Image URL">
<textarea id="content" placeholder="Story continue here using | separator"></textarea>
<button onclick="addStory()">➕ Add Story</button>
</div>
<script>
let stories = JSON.parse(localStorage.getItem("stories")) || {};
let current=null, part=0;

// 🔥 Render stories
 
function render(){
let box=document.getElementById("storyList");
box.innerHTML="";

Object.keys(stories).forEach(i=>{
let s=stories[i];

box.innerHTML += `
<div class='card' onclick='openS(${i})'>
<img src='${s.img}'>
<p>${s.title}</p>
</div>`;
});
}

// 🔥 Open story
function openS(id){
current=id;
part=0;
show();
}

// 🔥 Show story part
function show(){
let s = stories[current];
document.getElementById("storyBox").innerText = s.parts[part];
}

// 🔥 Next / Prev (optional future use)
function nextPart(){
if(!current) return;
if(part < stories[current].parts.length-1){
part++;
show();
}
}

function prevPart(){
if(!current) return;
if(part > 0){
part--;
show();
}
}

// 🔥 MAIN FIXED FUNCTION
function addStory(){
let t = document.getElementById("title").value;
let c = document.getElementById("content").value;
let img = document.getElementById("img").value;

// 👉 FIXED INTRO
let intro = [
"A dark night changed everything",
"Suddenly lights started blinking"
];

// 👉 USER STORY (yaha tu likhega)
let userParts = c ? c.split("|") : [];

// 👉 FIXED ENDING
let end = [
"Something was behind him",
"And then silence"
];

// 👉 FINAL MERGE
let finalStory = [...intro, ...userParts, ...end];

let id = Date.now();

stories[id] = {
title: t || "Untitled Story",
img: img || "https://i.imgur.com/3ZQ3ZQm.jpg",
parts: finalStory
};

localStorage.setItem("stories", JSON.stringify(stories));
render();
alert("Story Added!");
}

render();
</script>
