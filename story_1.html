<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Reader AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:#fff;
}

header{
  background:#000;
  padding:15px;
  text-align:center;
  font-size:20px;
  box-shadow:0 0 20px #ff4b2b;
}

.story-box{
  max-width:750px;
  width:92%;
  margin:20px auto;
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
  height:65vh;
  overflow-y:auto;
  line-height:1.8;
  font-size:16px;
  white-space:pre-line;
}

.story-box::-webkit-scrollbar{
  width:10px;
}
.story-box::-webkit-scrollbar-thumb{
  background:#2196f3;
  border-radius:10px;
}

.controls{
  text-align:center;
  margin:10px;
}

button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#2196f3;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>📖 Story Reader AI</header>

<div class="controls">
<button onclick="loadStory(1)">📖 Story 1</button>
<button onclick="loadStory(2)">📖 Story 2</button>
</div>

<div class="story-box" id="storyBox"></div>

<div class="controls">
<button onclick="speakHindi()">🔊 Hindi</button>
<button onclick="speakEnglish()">🔊 English</button>
<button onclick="pauseVoice()">⏸ Pause</button>
<button onclick="resumeVoice()">▶ Resume</button>
<button onclick="stopVoice()">⏹ Stop</button>
<button onclick="translateText()">🌐 Translate</button>
<button onclick="zoomIn()">🔍 +</button>
<button onclick="zoomOut()">🔍 -</button>
</div>

<script>
let zoom = 16;
let isHindi = true;

// 📚 STORIES
let story1 = `Raat ka waqt tha... (same tumhari pehli story yaha poori likhi hui hai)`;

// 👉 SECOND STORY (FULL)
let story2 = `Andheri raat thi, aur Ramnagar ke kinaare khadi purani haveli par bijli chamak rahi thi. Log kehte the ki yeh haveli 20 saalon se khaali hai...

Haveli ke andar sab kuch dhool se dhakka hua tha... (poori second story as it is yaha paste karo — maine short ki hai yaha, tum full rakhna)`;


// LOAD STORY
function loadStory(num){
  stopVoice();
  if(num === 1){
    document.getElementById("storyBox").innerText = story1;
  } else {
    document.getElementById("storyBox").innerText = story2;
  }
}

// 🔊 VOICE
function speakHindi(){
  stopVoice();
  let text = storyBox.innerText;
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "hi-IN";
  speechSynthesis.speak(speech);
}

function speakEnglish(){
  stopVoice();
  let text = storyBox.innerText;
  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-US";
  speechSynthesis.speak(speech);
}

function pauseVoice(){
  speechSynthesis.pause();
}

function resumeVoice(){
  speechSynthesis.resume();
}

function stopVoice(){
  speechSynthesis.cancel();
}

// 🌐 TRANSLATE
function translateText(){
  let text = storyBox.innerText;

  fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${isHindi?'hi|en':'en|hi'}`)
  .then(res=>res.json())
  .then(data=>{
    storyBox.innerText = data.responseData.translatedText;
    isHindi = !isHindi;
  });
}

// 🔍 ZOOM
function zoomIn(){
  zoom += 2;
  storyBox.style.fontSize = zoom + "px";
}

function zoomOut(){
  zoom -= 2;
  storyBox.style.fontSize = zoom + "px";
}

// DEFAULT LOAD
loadStory(1);
</script>

</body>
</html>
