<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Universe PRO AI</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  overflow:hidden;
}

.bg{
  position:fixed;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.35);
  z-index:-1;
  transition:1s;
}

header{
  text-align:center;
  padding:12px;
  background:#111;
}

.story-box{
  max-width:750px;
  margin:15px auto;
  background:rgba(0,0,0,0.75);
  padding:15px;
  border-radius:10px;
  height:60vh;
  overflow-y:auto;
  white-space:pre-line;
  font-size:16px;
}

.story-box::-webkit-scrollbar{width:8px;}
.story-box::-webkit-scrollbar-thumb{background:#2196f3;}

.controls{
  text-align:center;
}

button{
  margin:4px;
  padding:10px;
  border:none;
  border-radius:6px;
  background:#2196f3;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<header>📖 Story Universe PRO AI</header>

<div class="controls">
<button onclick="startStory(1)">Story 1</button>
<button onclick="startStory(2)">Story 2</button>
</div>

<div class="story-box" id="storyBox">Select a story</div>

<div class="controls">
<button onclick="speakHindi()">🔊 Hindi</button>
<button onclick="speakEnglish()">🔊 English</button>
<button onclick="pauseVoice()">⏸ Pause</button>
<button onclick="resumeVoice()">▶ Resume</button>
<button onclick="stopAll()">⏹ Stop</button>
<button onclick="translateText()">🌐 Translate</button>
<button onclick="zoomIn()">🔍 +</button>
<button onclick="zoomOut()">🔍 -</button>
</div>

<script>

let zoom = 16;
let isHindi = true;

/* =========================
   FULL STORIES (NO CUT)
========================= */

let story1 = `Raat ka waqt tha. Baarish ki halki boonden purani haveli ki tooti chhat par gir rahi thi. Aarav apni maa ki purani diary lekar us ghar mein aaya tha, jahan bachpan mein usne sab kuch kho diya tha. Diary ke aakhri panne par sirf itna likha tha — “Sach hamesha isi ghar mein chhupa hai.” Dil zor se dhadak raha tha, lekin usse lag raha tha ki aaj usse apne sawaalon ka jawab mil jayega.

Haveli ke andar sab kuch sannaata tha. Jaise waqt yahin ruk gaya ho. Aarav dheere-dheere seedhiyan chadhne laga, tabhi usse kisi ke chalne ki awaaz sunayi di. Woh ruk gaya. “Koi hai?” usne dheere se poocha… lekin jawab mein sirf hawa ki cheekh thi. Tabhi diary ka ek purana panna apne aap palat gaya. Us par likha tha — “Woh ab bhi yahin hai…” Aarav ke haath kaanpne lage.

Achanak ek kamre ka darwaza khud hi khul gaya. Andar andhera tha, lekin ek kone mein jalti hui diya si roshni thi. Aarav ne himmat karke andar kadam rakha… aur uski saansen ruk gayi. Diya ke paas uski maa khadi thi… wahi chehra, wahi muskaan… lekin aankhon mein ajeeb sa dard. “Maa…?” Aarav ki awaaz toot gayi.

Woh uski taraf badha, lekin jaise hi paas pahucha, uski maa ne haath utha kar use roka — “Sach jaanne ke liye tayyar ho?”

Maa ki aankhon se aansu behne lage. “Main kabhi gayi hi nahi thi, Aarav… main bas is ghar mein qaid ho gayi thi… aur jisne mujhe yahan baandh rakha hai… woh tum khud ho.”

Aarav ka dil jaise ruk gaya. Use yaad aaya… bachpan ki woh raat… gusse mein usne diya gira diya tha… aur aag ne sab kuch le liya.

Aakhri baar usne maa ki taraf dekha… aur phir sab kuch andhere mein kho gaya… sirf ek awaaz gunji — “Sach se kabhi bhaagna mat…”`;


/* =========================
   STORY 2 (FULL)
========================= */

let story2 = `Andheri raat thi, aur Ramnagar ke kinaare khadi purani haveli par bijli chamak rahi thi. Log kehte the ki yeh haveli 20 saalon se khaali hai, lekin har amavas ki raat wahan se kisi ke chalne ki awaaz aati hai. Kabir, jo ek curious journalist tha, in afwaahon ko jhooth sabit karna chahta tha. Apni camera aur recorder lekar woh us haveli ke darwaze tak pahunch gaya. Darwaza dheere se khola… aur ek thandi hawa ka jhonka uske chehre se takraaya.

Haveli ke andar sab kuch dhool se dhakka hua tha. Deewaron par purani tasveeren latak rahi thi, jinme logon ke chehre dheere-dheere mit chuke the. Kabir ne torch jalaya aur aage badha. Tabhi ek tasveer par nazar padi… usmein ek aadmi tha jo bilkul uski tarah dikh raha tha.

“Tum wapas aa gaye…” kisi ne uske kaan ke paas kaha.

Kabir ne peeche dekha, koi nahi tha. Recorder on kiya… lekin woh bhi band ho gaya. Thandi hawa badh gayi. Saans dikhne lagi.

Thak… thak… thak… seedhiyon se awaaz aayi.

Kabir upar gaya. Ek kamra khula tha. Andar aaina tha… aur uska reflection apne aap move kar raha tha.

Reflection bola — “Main tum hoon… aur tum main ho.”

Aur dheere-dheere reflection bahar aa gaya… real Kabir ban gaya.

Aakhri pal mein dono ek ho gaye… aur haveli phir se khamosh ho gayi.`;


/* =========================
   BACKGROUND MUSIC
========================= */

let audio = new Audio();
audio.loop = true;
audio.volume = 0.6;

let sounds = {
  1: "https://cdn.pixabay.com/download/audio/2023/03/06/audio_3b7f8d9c2c.mp3",
  2: "https://cdn.pixabay.com/download/audio/2022/10/25/audio_946f1c0c1b.mp3"
};


/* =========================
   IMAGES
========================= */

let images = {
  1: [
    "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
    "https://images.unsplash.com/photo-1501785888041-af3ef285b470"
  ],
  2: [
    "https://images.unsplash.com/photo-1495567720989-cebdbdd97913",
    "https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
  ]
};

let imgInterval;


/* =========================
   STORY LOAD
========================= */

function startStory(n){

  stopAll();

  storyBox.innerText = (n===1)?story1:story2;

  // MUSIC
  audio = new Audio(sounds[n]);
  audio.loop = true;
  audio.play().catch(()=>console.log("click needed"));

  // IMAGES
  let imgs = images[n];
  let i = 0;
  bg.style.backgroundImage = `url(${imgs[0]})`;

  clearInterval(imgInterval);
  imgInterval = setInterval(()=>{
    i = (i+1)%imgs.length;
    bg.style.backgroundImage = `url(${imgs[i]})`;
  },3000);
}


/* =========================
   VOICE
========================= */

function speakHindi(){
  speechSynthesis.cancel();
  let s = new SpeechSynthesisUtterance(storyBox.innerText);
  s.lang="hi-IN";
  speechSynthesis.speak(s);
}

function speakEnglish(){
  speechSynthesis.cancel();
  let s = new SpeechSynthesisUtterance(storyBox.innerText);
  s.lang="en-US";
  speechSynthesis.speak(s);
}

function pauseVoice(){speechSynthesis.pause();}
function resumeVoice(){speechSynthesis.resume();}

function stopAll(){
  speechSynthesis.cancel();
  audio.pause();
  clearInterval(imgInterval);
}


/* =========================
   TRANSLATE (simple toggle)
========================= */

function translateText(){
  let text = storyBox.innerText;

  fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${isHindi?'hi|en':'en|hi'}`)
  .then(r=>r.json())
  .then(d=>{
    storyBox.innerText = d.responseData.translatedText;
    isHindi=!isHindi;
  });
}


/* =========================
   ZOOM
========================= */

function zoomIn(){
  zoom += 2;
  storyBox.style.fontSize = zoom+"px";
}

function zoomOut(){
  zoom -= 2;
  storyBox.style.fontSize = zoom+"px";
}

</script>

</body>
</html>
