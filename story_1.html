<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Universe PRO AI</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:#fff;
}

/* Glowing header */
header{
  background:#000;
  padding:15px;
  text-align:center;
  font-size:20px;
  box-shadow:0 0 20px #ff4b2b;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 10px #ff4b2b;}
  to{box-shadow:0 0 25px #00c853;}
}

.container{display:flex;flex-wrap:wrap;justify-content:center;padding:10px;}
.card{width:160px;margin:10px;background:#1c1c1c;border-radius:10px;overflow:hidden;cursor:pointer;transition:0.3s;position:relative;}
.card:hover{transform:scale(1.05);}
.card img{width:100%;height:110px;object-fit:cover;}
.card p{text-align:center;font-size:13px;}
.views{position:absolute;top:5px;right:5px;background:#000;padding:3px 6px;font-size:10px;border-radius:5px;}

.story-box{max-width:800px;margin:10px auto;background:#1a1a1a;padding:20px;border-radius:10px;min-height:120px;white-space:pre-line;opacity:0;transform:translateY(20px);transition:0.5s;}
.story-box.show{opacity:1;transform:translateY(0);}

.controls{text-align:center;margin:10px;}
.controls button{margin:3px;padding:10px;border:none;border-radius:6px;cursor:pointer;background:#ff4b2b;color:#fff;}
.next{display:block;margin:10px auto;padding:10px;background:#00c853;border:none;color:#fff;border-radius:6px;}

.addBox{text-align:center;margin:10px;}
.addBox input,.addBox textarea{width:90%;margin:5px;padding:8px;}
.addBox button{padding:10px;background:#2196f3;color:#fff;border:none;border-radius:6px;}

.soundBtn,.voiceBtn,.langBtn,.aiBtn{
position:fixed;right:20px;background:#333;padding:10px;border-radius:50%;cursor:pointer;
}
.soundBtn{bottom:160px;}
.voiceBtn{bottom:120px;}
.langBtn{bottom:80px;}
.aiBtn{bottom:40px;}

footer{text-align:center;padding:10px;background:#000;font-size:12px;}

/* Logo style */
.logo{
  width:40px;
  height:40px;
  border-radius:10px;
  margin-right:10px;
}

.headerWrap{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

</style>
</head>
<body>

<header>
  <div class="headerWrap">
    <img class="logo" src="https://i.imgur.com/6Q3ZQZl.png">
    📖 Story Universe PRO AI
  </div>
</header>

<div class="container" id="storyList"></div>

<div class="controls">
<button onclick="prevPart()">⬅ Prev</button>
<button onclick="nextPart()">➡ Next</button>
</div>

<div class="story-box" id="storyBox">Select story</div>

<div class="addBox">
<h3>Add Story</h3>
<input id="title" placeholder="Title">
<input id="img" placeholder="Image">
<textarea id="content" placeholder="Story parts | separated"></textarea>
<button onclick="addStory()">➕ Add</button>
</div>

<!-- CONTROLS -->
<div class="soundBtn" onclick="toggleSound()">🔊</div>
<div class="voiceBtn" onclick="toggleVoice()">🎤</div>
<div class="langBtn" onclick="toggleLang()">🌐</div>
<div class="aiBtn" onclick="generateAIStory()">🤖</div>

<!-- AUDIO -->
<audio id="bgm"></audio>

<footer>© PRO AI Story Universe</footer>

<script>
let soundOn=true;
let voiceOn=true;
let lang="en";
let mood="neutral";

const moods={
neutral:null,
horror:"https://www.soundjay.com/misc/sounds/creepy-ambience.mp3",
happy:"https://www.soundjay.com/misc/sounds/light-background-music.mp3",
sad:"https://www.soundjay.com/misc/sounds/sad-music.mp3"
};

function setMood(m){
mood=m;
let bg=document.getElementById("bgm");
bg.src=moods[m]||"";
if(soundOn && bg.src) bg.play();
}

function toggleSound(){soundOn=!soundOn;alert(soundOn?"Sound ON":"OFF");}
function toggleVoice(){voiceOn=!voiceOn;window.speechSynthesis.cancel();alert(voiceOn?"Voice ON":"OFF");}
function toggleLang(){lang=lang=="en"?"hi":"en";alert(lang);}

function speak(text){
if(!voiceOn) return;
let u=new SpeechSynthesisUtterance(text);
u.lang=lang=="hi"?"hi-IN":"en-US";
u.rate=mood=="horror"?0.8:1;
u.pitch=mood=="happy"?1.3:1;
window.speechSynthesis.cancel();
window.speechSynthesis.speak(u);
}

function generateAIStory(){
let base=[
"A dark night changed everything",
"Suddenly lights started blinking",
"EMOTIONAL ATTACHMENT YE KAHANI HAI EK ESE DO DILO KI JO EMOTIONAL ATTACHMENT KI AAD ME FASE THE JISE VO PYAR SMJH BETHE,"  
"Something was behind him",
"And then silence"
];
let id=Date.now();
stories[id]={title:"AI Story",img:"https://i.imgur.com/3ZQ3ZQm.jpg",views:0,parts:base};
save();render();alert("AI Story Generated");
}

let stories=JSON.parse(localStorage.getItem("stories"))||{
1:{title:"Raat 3 AM",img:"https://i.imgur.com/3ZQ3ZQm.jpg",views:0,parts:["Raat 3 baje...","System on...","Window khali...","Phone ring...","Peeche dekho..."]}
};

let current=null,part=0;

function render(){
let box=document.getElementById("storyList");
box.innerHTML="";
Object.keys(stories).forEach(i=>{
let s=stories[i];
box.innerHTML+=`<div class='card' onclick='openS(${i})'><img src='${s.img}'><p>${s.title}</p><div class='views'>👁 ${s.views}</div></div>`;
});
}

function openS(id){current=id;part=0;stories[id].views++;save();show();render();}

function show(){
let t=stories[current].parts[part];
document.getElementById("storyBox").classList.add("show");
document.getElementById("storyBox").innerText=t;
speak(t);
}

function nextPart(){if(!current)return;if(part<stories[current].parts.length-1){part++;show();}}
function prevPart(){if(!current)return;if(part>0){part--;show();}}

function addStory(){
let t=document.getElementById("title").value;
let c=document.getElementById("content").value;
let img=document.getElementById("img").value;
let id=Date.now();
stories[id]={title:t,img:img||"https://i.imgur.com/3ZQ3ZQm.jpg",views:0,parts:c.split("|")};
save();render();}

function save(){localStorage.setItem("stories",JSON.stringify(stories));}

render();

// PWA SERVICE WORKER
if('serviceWorker' in navigator){
window.addEventListener('load',()=>{
navigator.serviceWorker.register('sw.js');
});
}
</script>

</body>
</html>
