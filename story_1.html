<textarea id="content" placeholder="Story continue here using | separator">Andheri raat thi, aur Ramnagar ke kinaare khadi purani haveli par bijli chamak rahi thi. Log kehte the ki yeh haveli 20 saalon se khaali hai, lekin har amavas ki raat wahan se kisi ke chalne ki awaaz aati hai. Kabir, jo ek curious journalist tha, in afwaahon ko jhooth sabit karna chahta tha. Apni camera aur recorder lekar woh us haveli ke darwaze tak pahunch gaya. Darwaza dheere se khola… aur ek thandi hawa ka jhonka uske chehre se takraaya, jaise kisi ne use andar aane ka signal diya ho.

Haveli ke andar sab kuch dhool se dhakka hua tha. Deewaron par purani tasveeren latak rahi thi, jinme logon ke chehre dheere-dheere mit chuke the. Kabir ne apna torch jalaya aur aage badhne laga. Tabhi uski nazar ek tasveer par padi… us tasveer mein ek aadmi tha, jo bilkul uski tarah dikh raha tha. Kabir ek pal ke liye jam gaya. “Yeh kaise ho sakta hai?” usne socha. Jaise hi woh tasveer ke kareeb gaya, uske kaan ke paas kisi ne dheere se phusphusaya — “Tum wapas aa gaye…”

Kabir ne ghabra kar peeche mudkar dekha, lekin wahan koi nahi tha. Uska dil zor-zor se dhadakne laga. Usne jaldi se recorder on kiya aur bolne laga, “Yahan koi hai… mujhe awaaz sunayi de rahi hai…” Tabhi recorder apne aap band ho gaya. Haveli ke andar ka temperature achanak bahut thanda ho gaya. Uski saansein dikhne lagi, jaise sardiyon ki raat ho. Tabhi seedhiyon se kisi ke dheere-dheere neeche utarne ki awaaz aayi… thak… thak… thak…

Kabir himmat jod kar seedhiyon ki taraf badha. Har kadam par use lag raha tha ki koi usse dekh raha hai. Jaise hi woh upar pahucha, usne ek kamra dekha jiska darwaza aadha khula tha. Andar se halki si roshni aa rahi thi. Kabir ne darwaza dhakka dekar khola… aur uski aankhen phat gayi. Kamre ke beech mein ek purana aaina tha… aur us aaine mein uska reflection khud se alag chal raha tha. Reflection usse dekh kar muskura raha tha, jabki Kabir ka chehra dara hua tha.

“Tum yahan phir aa hi gaye…” reflection ne kaha. Kabir peeche hat gaya, lekin uska reflection aaine ke andar se bahar aane laga. Dheere-dheere woh ek alag insaan ban gaya… bilkul Kabir jaisa. “Main tum hoon… aur tum main ho,” usne thandi awaaz mein kaha. Kabir ko achanak yaad aaya — bachpan mein woh isi haveli mein kho gaya tha, aur tab se usse ajeeb sapne aate the. Shayad uska ek hissa yahin reh gaya tha… ya shayad kabhi gaya hi nahi.

Aakhri pal mein Kabir ne bhaagne ki koshish ki, lekin uske pair jaise jam gaye. Uska dusra roop dheere-dheere uske kareeb aaya… aur use chhoo liya. Ek tez cheekh haveli mein goonj uthi… aur phir sab kuch shaant ho gaya. Agle din logon ne dekha ki haveli ka darwaza khula hai, lekin andar koi nahi tha. Bas deewar par ek nayi tasveer latak rahi thi… usmein Kabir khada tha… aur uske peeche ek aur Kabir muskura raha tha. Tab se, har amavas ki raat, koi naya mehmaan us haveli ki taraf kheechta chala aata hai… jaise koi uska intezaar kar raha ho.
</textarea>
<button onclick="addStory()">➕ Add Story</button>

<script>
let stories = JSON.parse(localStorage.getItem("stories")) || {};
let current=null, part=0;

// 🔥 Render stories
 
function render(){
let box=document.getElementById("storyList");
box.innerHTML="";

Object.keys(stories).forEach(i=>{
let s=stories[i];

box.innerHTML += `
<div class='card' onclick='openS(${i})'>
<img src='${s.img}'>
<p>${s.title}</p>
</div>`;
});
}

// 🔥 Open story
function openS(id){
current=id;
part=0;
show();
}

// 🔥 Show story part
function show(){
let s = stories[current];
document.getElementById("storyBox").innerText = s.parts[part];
}

// 🔥 Next / Prev (optional future use)
function nextPart(){
if(!current) return;
if(part < stories[current].parts.length-1){
part++;
show();
}
}

function prevPart(){
if(!current) return;
if(part > 0){
part--;
show();
}
}

// 🔥 MAIN FIXED FUNCTION
function addStory(){
let t = document.getElementById("title").value;
let c = document.getElementById("content").value;
let img = document.getElementById("img").value;

// 👉 FIXED INTRO
let intro = [
"A dark night changed everything",
"Suddenly lights started blinking"
];

// 👉 USER STORY (yaha tu likhega)
let userParts = c ? c.split("|") : [];

// 👉 FIXED ENDING
let end = [
"Something was behind him",
"And then silence"
];

// 👉 FINAL MERGE
let finalStory = [...intro, ...userParts, ...end];

let id = Date.now();

stories[id] = {
title: t || "Untitled Story",
img: img || "https://i.imgur.com/3ZQ3ZQm.jpg",
parts: finalStory
};

localStorage.setItem("stories", JSON.stringify(stories));
render();
alert("Story Added!");
}

render();
</script>
