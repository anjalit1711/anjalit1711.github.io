<!DOCTYPE html>
<html>
<head>
<title>CSS Feature Project</title>
  <style >
    
    body{
font-family: Arial;
background: linear-gradient(to right, #74ebd5, #ACB6E5);
text-align:center;
}

/* Text Effect + Animation */
.title{
font-size:40px;
color:#333;
text-shadow:2px 2px 5px gray;
animation:move 3s infinite alternate;
}

@keyframes move{
from{letter-spacing:2px;}
to{letter-spacing:10px;}
}

.container{
display:flex;
justify-content:center;
gap:30px;
margin-top:50px;
perspective:1000px;
}

/* Card */
.card{
background:white;
width:220px;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
transition:1s;
}

/* 2D Transform + Skew + Zoom */
.card:hover{
transform: scale(1.2) skewX(20deg) skewY(15deg);
}

/* Image Styling + Zoom */
.card img{
width:100%;
border-radius:10px;
transition:0.5s;
}

.card img:hover{
transform:scale(1.3);
}

/* Matrix Transform */
.matrix-box{
width:200px;
height:200px;
background:red;
margin:40px auto;
transition:1s;
}

.matrix-box:hover{
transform:matrix(1.2,0.2,0.2,1.2,20,20);
}

/* 3D Rotate */
.rotate3d{
width:200px;
height:200px;
background:orange;
margin:40px auto;
transition:1s;
}

.rotate3d:hover{
transform:rotateX(180deg) rotateY(180deg);
}

/* Flip Card */
.flip-card{
background:transparent;
width:220px;
height:250px;
perspective:1000px;
margin:40px auto;
}

.flip-inner{
position:relative;
width:100%;
height:100%;
transition:1s;
transform-style:preserve-3d;
}

.flip-card:hover .flip-inner{
transform:rotateY(180deg);
}

.flip-front, .flip-back{
position:absolute;
width:100%;
height:100%;
backface-visibility:hidden;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}

.flip-front{
background:white;
}

.flip-back{
background:purple;
color:white;
transform:rotateY(180deg);
}

/* Button */
.btn{
background:blue;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
position:relative;
transition:0.5s;
}

.btn:hover{
background:darkblue;
}

/* Tooltip */
.tooltip{
visibility:hidden;
background:black;
color:white;
padding:5px;
border-radius:5px;
position:absolute;
top:-30px;
left:20px;
}

.btn:hover .tooltip{
visibility:visible;
}
   </style>
</head>

<body>

<h1 class="title">My CSS Project</h1>

<div class="container">

<div class="card">
<img src="https://picsum.photos/200">
<h2>Beautiful Nature</h2>
<p>CSS Effects Example</p>
<button class="btn">Hover Me
<span class="tooltip">Click Here</span>
</button>
</div>

<div class="card">
<img src="https://picsum.photos/201">
<h2>Mountains</h2>
<p>CSS Animation Demo</p>
<button class="btn">Hover Me
<span class="tooltip">Hello</span>
</button>
</div>

</div>
  <div class="matrix-box"></div>

<div class="rotate3d"></div>

<div class="flip-card">
  <div class="flip-inner">
  
    <div class="flip-front">
      Front Side
    </div>

    <div class="flip-back">
      Back Side
    </div>

  </div>
</div>

</body>
</html>
