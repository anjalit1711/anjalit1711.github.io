<!DOCTYPE html>
<html>
<head>
<title>CSS Feature Project</title>
  <style >
    
   body{
font-family: Arial;
background: linear-gradient(to right, #74ebd5, #ACB6E5);
text-align:center;
}

/* Text Effect + Animation */
.title{
font-size:40px;
color:#333;
text-shadow:2px 2px 5px gray;
animation:move 3s infinite alternate;
}

@keyframes move{
from{letter-spacing:2px;}
to{letter-spacing:10px;}
}

.container{
display:flex;
justify-content:center;
gap:30px;
margin-top:50px;
}

/* Card */
.card{
background:white;
width:220px;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
transition:0.5s;
}

/* 2D Transform */
.card:hover{
transform:scale(1.1);
}

/* Image Styling */
.card img{
width:100%;
border-radius:10px;
}

/* Button */
.btn{
background:blue;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
position:relative;
}

/* Tooltip */
.tooltip{
visibility:hidden;
background:black;
color:white;
padding:5px;
border-radius:5px;
position:absolute;
top:-30px;
left:20px;
}

.btn:hover .tooltip{
visibility:visible;
}
</style>
</head>

<body>

<h1 class="title">My CSS Project</h1>

<div class="container">

<div class="card">
<img src="https://picsum.photos/200">
<h2>Beautiful Nature</h2>
<p>CSS Effects Example</p>
<button class="btn">Hover Me
<span class="tooltip">Click Here</span>
</button>
</div>

<div class="card">
<img src="https://picsum.photos/201">
<h2>Mountains</h2>
<p>CSS Animation Demo</p>
<button class="btn">Hover Me
<span class="tooltip">Hello</span>
</button>
</div>

</div>

</body>
</html>
