
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Image Examples</title>
  <style>
   

body{
  margin:0;
  height:100vh;
  text-align:center;
  font-family:Arial;
  color:white;

  background: linear-gradient(
    135deg,
    var(--color1),
    var(--color2),
    var(--color3)
  );

  animation: flow 6s ease infinite;
}

@keyframes flow{

  0%{
    --color1:#ff6ec7;
    --color2:#7ec8ff;
    --color3:#9b59ff;
  }

  50%{
    --color1:#ff9ad5;
    --color2:#87ceeb;
    --color3:#b084ff;
  }

  100%{
    --color1:#ff6ec7;
    --color2:#7ec8ff;
    --color3:#9b59ff;
  }

}

@property --startColor {
  syntax: "<color>";
  initial-value: #EADEDB;
  inherits: false;
}

@property --color1 {
  syntax: "<color>";
  initial-value: #ff6ec7;
  inherits: false;
}

@property --color2 {
  syntax: "<color>";
  initial-value: #7ec8ff;
  inherits: false;
}

@property --color3 {
  syntax: "<color>";
  initial-value: #9b59ff;
  inherits: false;
}

h1{
  margin-top:200px;
  font-size:80%px;
}



    /* =====================
       0. Text Masking
    ===================== */
    .mask-text {
      font-size: 700px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      background-image: url("https://picsum.photos/800/400");
      background-size: cover;
      background-position: center;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
       
    }

    /* =====================
       1. Image Styling
    ===================== */
    .styled-img {
      width: 250px;
      border: 5px solid black;
      border-radius: 20px;
      box-shadow: 0 0 15px gray;
    }

    /* =====================
       2. Image Centering
    ===================== */
    .center {
      display: block;
      margin: auto;
    }

    /* =====================
       3. Image Filters
    ===================== */
    .filter-img {
      width: 250px;
      filter: grayscale(100%) blur(2px);
    }

    /* =====================
       4. Image Shapes
    ===================== */
    .circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* =====================
       5. object-fit
    ===================== */
    .fit-box {
      width: 250px;
      height: 150px;
      border: 2px solid red;
      margin: auto;
      overflow: hidden;
    }

    .fit-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =====================
       6. object-position
    ===================== */
    .position-box img {
      object-fit: cover;
      object-position: top;
    }

    /* =====================
       7. Image Modal
    ===================== */
    .modal-img {
      width: 200px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
    }

    .modal img {
      display: block;
      margin: 5% auto;
      width: 60%;
    }

    /* =====================
       8. Masking PNG
    ===================== */
    .mask-png {
      width: 250px;
      -webkit-mask-image: url("https://www.w3schools.com/css/w3logo.png");
      mask-image: url("https://www.w3schools.com/css/w3logo.png");
      mask-size: cover;
    }

    /* =====================
       9. Masking Gradient
    ===================== */
    .mask-gradient {
      width: 250px;
      mask-image: linear-gradient(black, transparent);
    }

    /* =====================
       10. Masking SVG
    ===================== */
    .mask-svg {
      width: 250px;
    }
  </style>
</head>

<body>

  <!-- Text Masking -->
  <h1 class="mask-text">ANJALI</h1>

  <!-- 1. Image Styling -->
  <h2>1. Image Styling</h2>
  <img src="https://picsum.photos/300" class="styled-img">

  <!-- 2. Image Centering -->
  <h2>2. Image Centering</h2>
  <img src="https://picsum.photos/301" class="styled-img center">

  <!-- 3. Image Filters -->
  <h2>3. Image Filters</h2>
  <img src="https://picsum.photos/302" class="filter-img">

  <!-- 4. Image Shape (Circle) -->
  <h2>4. Image Shape (Circle)</h2>
  <img src="https://picsum.photos/303" class="circle">

  <!-- 5. object-fit -->
  <h2>5. object-fit</h2>
  <div class="fit-box">
    <img src="https://picsum.photos/500/300">
  </div>

  <!-- 6. object-position -->
  <h2>6. object-position</h2>
  <div class="fit-box position-box">
    <img src="https://picsum.photos/500/300">
  </div>

  <!-- 7. Image Modal -->
  <h2>7. Image Modal</h2>
  <img src="https://picsum.photos/304" class="modal-img" onclick="openModal(this.src)">

  <div class="modal" id="modal">
    <img id="modalImg">
  </div>

  <!-- 8. Masking PNG -->
  <h2>8. Masking PNG</h2>
  <img src="https://picsum.photos/305" class="mask-png">

  <!-- 9. Masking Gradient -->
  <h2>9. Masking Gradient</h2>
  <img src="https://picsum.photos/306" class="mask-gradient">

  <!-- 10. Masking SVG -->
  <h2>10. Masking SVG</h2>
  <svg width="0" height="0">
    <mask id="svgmask">
      <circle cx="125" cy="125" r="100" fill="white"/>
    </mask>
  </svg>
  <img src="https://picsum.photos/307" class="mask-svg" style="mask:url(#svgmask); -webkit-mask:url(#svgmask);">

  <!-- Modal Script -->
  <script>
    function openModal(src) {
      const modal = document.getElementById("modal");
      const modalImg = document.getElementById("modalImg");
      modal.style.display = "block";
      modalImg.src = src;
    }

    document.getElementById("modal").onclick = function() {
      this.style.display = "none";
    }
  </script>

</body>
</html>
