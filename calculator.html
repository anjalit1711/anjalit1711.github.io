<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Calculator</title>
<style>
    /* Basic Reset */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #eef2f7; /* same soft background */
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    header{
        text-align: center;
        padding: 30px 20px;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        color: white;
        font-size: 2rem;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .calculator-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .calculator {
        background-color: #222;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 400px;
    }

    .display {
        width: 100%;
        height: 60px;
        font-size: 2rem;
        text-align: right;
        margin-bottom: 15px;
        border: none;
        border-radius: 10px;
        padding: 10px;
        background-color: #fff;
        color: #2c3e50;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-gap: 10px;
    }

    .btn {
        background-color: #2575fc; /* same blue as portfolio buttons */
        color: white;
        font-size: 1.5rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        padding: 15px;
        transition: 0.3s;
    }

    .btn:hover {
        background-color: #6a11cb; /* purple hover */
    }

    .equal {
        background-color: #ff9500;
    }

    .equal:hover {
        background-color: #ffa733;
    }

    footer{
        text-align: center;
        padding: 20px;
        background:#2c3e50;
        color:white;
        font-size:16px;
        box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
    }

    .back-home {
        display: block;
        width: 200px;
        margin: 20px auto 0 auto;
        padding: 10px;
        text-align: center;
        border-radius: 10px;
        background: #2575fc;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition:0.3s;
    }

    .back-home:hover {
        background:#6a11cb;
    }

    /* Responsive adjustments */
    @media (max-width: 500px) {
        .display { font-size: 1.5rem; height: 50px; }
        .btn { font-size: 1.2rem; padding: 12px; }
    }

    @media (max-width: 350px) {
        .display { font-size: 1.2rem; height: 45px; }
        .btn { font-size: 1rem; padding: 10px; }
    }
</style>
</head>
<body>

<header>
    Responsive Calculator
</header>

<div class="calculator-container">
<div class="calculator">
    <input type="text" class="display" id="display" disabled>

    <div class="buttons">
        <button class="btn" onclick="clearDisplay()">C</button>
        <button class="btn" onclick="backspace()">⌫</button>
        <button class="btn" onclick="appendValue('%')">%</button>
        <button class="btn" onclick="appendValue('/')">/</button>

        <button class="btn" onclick="appendValue('7')">7</button>
        <button class="btn" onclick="appendValue('8')">8</button>
        <button class="btn" onclick="appendValue('9')">9</button>
        <button class="btn" onclick="appendValue('*')">*</button>

        <button class="btn" onclick="appendValue('4')">4</button>
        <button class="btn" onclick="appendValue('5')">5</button>
        <button class="btn" onclick="appendValue('6')">6</button>
        <button class="btn" onclick="appendValue('-')">-</button>

        <button class="btn" onclick="appendValue('1')">1</button>
        <button class="btn" onclick="appendValue('2')">2</button>
        <button class="btn" onclick="appendValue('3')">3</button>
        <button class="btn" onclick="appendValue('+')">+</button>

        <button class="btn" onclick="appendValue('0')">0</button>
        <button class="btn" onclick="appendValue('.')">.</button>
        <button class="btn" onclick="appendValue('**')">x²</button>
        <button class="btn equal" onclick="calculate()">=</button>

        <button class="btn" onclick="squareRoot()">√</button>
    </div>
</div>
</div>

<a href="../index.html" class="back-home">← Back to Home</a>

<footer>
    © 2026 Anjali Tripathi • All Rights Reserved
</footer>

<script>
    const display = document.getElementById('display');

    function appendValue(value) {
        display.value += value;
    }

    function clearDisplay() {
        display.value = '';
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            let result = display.value;
            if(result.includes('%')) {
                result = result.replace('%', '/100');
            }
            display.value = eval(result);
        } catch (error) {
            display.value = 'Error';
        }
    }

    function squareRoot() {
        try {
            display.value = Math.sqrt(eval(display.value));
        } catch {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
