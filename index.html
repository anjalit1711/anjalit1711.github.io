<!DOCTYPE html>
<html>
<head>
<title>Mini Chat App</title>
<style>
body{
    font-family:Arial;
    background:#f0f0f0;
    padding:20px;
}
.container{
    width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:5px;
    border:1px solid #ccc;
}
button{
    padding:10px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:5px;
}
#chatBox{
    max-height:300px;
    overflow-y:auto;
    border:1px solid #ccc;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    background:#fafafa;
}
.message{
    background:#eee;
    padding:8px;
    margin:5px 0;
    border-radius:5px;
}
.message strong{
    color:#4CAF50;
}
.error{color:red;}
</style>
</head>
<body>

<div class="container">

<h2>Mini Chat Application</h2>

<div id="loginSection">
    <input id="username" placeholder="Enter your username">
    <button onclick="login()">Login</button>
    <p id="loginError" class="error"></p>
</div>

<div id="chatSection" style="display:none;">
    <h3>Welcome, <span id="currentUser"></span>!</h3>
    <textarea id="message" placeholder="Type your message..."></textarea>
    <button onclick="sendMessage()">Send</button>
    <p id="messageError" class="error"></p>
    <input id="search" placeholder="Search messages..." onkeyup="searchMessages()">
    <div id="chatBox"></div>
</div>

</div>

<script>
let messages=[];
let currentUser="";

// Simple bad words list
let badWords=["badword1","badword2"];

// Login function
function login(){
    let username=document.getElementById("username").value.trim();
    let error=document.getElementById("loginError");
    error.innerText="";
    if(username===""){
        error.innerText="Username required";
        return;
    }
    currentUser=username;
    document.getElementById("currentUser").innerText=currentUser;
    document.getElementById("loginSection").style.display="none";
    document.getElementById("chatSection").style.display="block";
}

// Send message function
function sendMessage(){
    let msg=document.getElementById("message").value.trim();
    let error=document.getElementById("messageError");
    error.innerText="";

    // Validate message
    if(msg===""){
        error.innerText="Message cannot be empty";
        return;
    }
    // Check for bad words using RegExp
    let pattern=new RegExp(badWords.join("|"),"i");
    if(pattern.test(msg)){
        error.innerText="Message contains inappropriate words";
        return;
    }

    // Add message to array
    let messageObj={user:currentUser,text:msg};
    messages.push(messageObj);
    displayMessages();
    document.getElementById("message").value="";
}

// Display messages
function displayMessages(){
    let chatBox=document.getElementById("chatBox");
    chatBox.innerHTML="";
    messages.forEach((msg)=>{
        let div=document.createElement("div");
        div.className="message";
        div.innerHTML=`<strong>${msg.user}:</strong> ${msg.text}`;
        chatBox.appendChild(div);
    });
    chatBox.scrollTop=chatBox.scrollHeight;
}

// Search messages using RegExp
function searchMessages(){
    let text=document.getElementById("search").value;
    let pattern=new RegExp(text,"i");
    let chatBox=document.getElementById("chatBox");
    chatBox.innerHTML="";
    messages.forEach((msg)=>{
        if(pattern.test(msg.user) || pattern.test(msg.text)){
            let div=document.createElement("div");
            div.className="message";
            div.innerHTML=`<strong>${msg.user}:</strong> ${msg.text}`;
            chatBox.appendChild(div);
        }
    });
}
</script>


</body>
</html>
